services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - VITE_AD_PROVIDER_ID=${VITE_AD_PROVIDER_ID:-}
      - VITE_AD_SLOT_TOP=${VITE_AD_SLOT_TOP:-}
      - VITE_AD_SLOT_BOTTOM=${VITE_AD_SLOT_BOTTOM:-}
      - VITE_AD_SLOT_VIDEO=${VITE_AD_SLOT_VIDEO:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
